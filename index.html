<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEA Caiza "D" · Gestión de Laboratorio</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<div id="login"><form class="box" onsubmit="return L(event)"><img class="logo" src="img/logo.jpeg" alt="Logo CEA Caiza D"><h1>CEA Caiza "D"</h1><small>Gestión de incidencias, diagnósticos y mantenimiento del laboratorio</small>
<input id="u" placeholder="Usuario" required><input id="p" type="password" placeholder="Contraseña" required><button>Ingresar</button><div id="err"></div></form></div>
<div id="app"><aside><img class="logo sm" src="img/logo.jpeg" alt="Logo"><h2>Lab. CEA Caiza "D"</h2>
<button class="nav on" data-v="dash">📊 Dashboard</button><button class="nav" data-v="eq">💻 Equipos</button><button class="nav" data-v="inc">🚨 Incidencias</button><button class="nav" data-v="man">🛠️ Mantenimiento</button><button class="nav" data-v="hor">🗓️ Horario</button>
<div style="flex:1"></div><small id="who" style="color:var(--m)"></small><button class="g" onclick="reporte()">📄 Reporte PDF</button><button class="g" onclick="api('logout','POST').then(()=>location.reload())">Cerrar sesión</button></aside><main id="main"></main></div>
<div id="mod" onclick="if(event.target==this)X()"><div class="card" id="mc"></div></div>
<script src="js/jspdf.umd.min.js"></script><script src="js/jspdf.plugin.autotable.min.js"></script><script src="js/api.js"></script><script src="js/horario.js"></script><script src="js/app.js"></script></body></html>
